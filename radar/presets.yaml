# Topic presets. In config.yaml, list a preset by its key (e.g. `- probability`)
# or override fields (e.g. `- preset: probability` + `top_k: 5`).
#
# Fields: name, name_zh, field, source (arxiv | biorxiv | medrxiv | rss), categories or feeds,
#         keywords (optional), primary_only (optional), interest, top_k.
#   keywords      only fetch papers whose title or abstract contains one of them
#   primary_only  arXiv: keep a paper only if its *primary* category is listed
#                 (drops cross-listed papers from unrelated fields)
# arXiv categories:            https://arxiv.org/category_taxonomy
# bioRxiv/medRxiv categories:  the subject areas on biorxiv.org / medrxiv.org

# ================================================================ Mathematics

probability:
  name: Probability
  name_zh: 概率
  field: Mathematics
  categories: [math.PR]
  interest: >
    Probability theory, random matrices, stochastic differential equations,
    interacting particle systems, mean-field limits, propagation of chaos,
    optimal transport, concentration of measure, high-dimensional probability,
    Gaussian processes, spin glasses, percolation, Markov chain mixing, random graphs.

differential-geometry:
  name: Differential geometry
  name_zh: 微分几何
  field: Mathematics
  categories: [math.DG, math.SG]
  interest: >
    Riemannian geometry, curvature, geometric flows, Ricci flow, minimal surfaces,
    geometric analysis, Lie groups, connections and fiber bundles, symplectic and
    Hamiltonian geometry, moment maps, Kahler geometry, information geometry.

pde:
  name: Partial differential equations
  name_zh: 偏微分方程
  field: Mathematics
  categories: [math.AP]
  interest: >
    Nonlinear partial differential equations, elliptic and parabolic PDE,
    dispersive equations, nonlinear Schrodinger equation, wave equations,
    Navier-Stokes and fluid equations, Hamilton-Jacobi equations, viscosity solutions,
    Fokker-Planck equations, gradient flows, regularity theory, free boundary problems.

harmonic-analysis:
  name: Harmonic analysis
  name_zh: 调和分析
  field: Mathematics
  categories: [math.CA, math.FA]
  interest: >
    Harmonic analysis, Fourier analysis, singular integrals, Calderon-Zygmund
    theory, Littlewood-Paley theory, Fourier restriction, decoupling, Kakeya
    problems, oscillatory integrals, Fourier multipliers, maximal functions,
    weighted inequalities, wavelets, time-frequency analysis, functional analysis,
    Banach and Hilbert spaces.

complex-analysis:
  name: Complex analysis
  name_zh: 复分析
  field: Mathematics
  categories: [math.CV]
  interest: >
    Holomorphic functions, normal families, conformal mappings, Riemann
    surfaces, potential theory, value distribution, several complex variables,
    pluripotential theory, complex dynamics, quasiconformal maps.

operator-algebras:
  name: Operator algebras and spectral theory
  name_zh: 算子代数与谱理论
  field: Mathematics
  categories: [math.OA, math.SP]
  interest: >
    C*-algebras, von Neumann algebras, operator theory, spectral theory,
    noncommutative geometry, free probability, quantum groups, K-theory of
    operator algebras, Schrodinger operators, eigenvalue asymptotics.

algebra:
  name: Algebra
  name_zh: 代数
  field: Mathematics
  categories: [math.RA, math.AC, math.GR]
  interest: >
    Group theory, rings and modules, commutative algebra, homological algebra,
    noncommutative algebra, Lie algebras, finite groups, geometric group theory,
    Hopf algebras, quivers.

representation-theory:
  name: Representation theory
  name_zh: 表示论
