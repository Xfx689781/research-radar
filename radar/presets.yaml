# ================================================================ Computer science and AI

ml-theory:
  name: Machine learning theory
  name_zh: 机器学习理论
  field: Computer science and AI
  categories: [stat.ML, cs.LG]
  keywords: [generalization bound, sample complexity, PAC-Bayes, minimax, mean-field,
             neural tangent kernel, implicit bias, benign overfitting, double descent,
             conformal prediction, singular learning theory, Wasserstein gradient flow,
             optimal transport, random matrix, information geometry, convergence rate]
  interest: >
    Rigorous theory of machine learning, generalization bounds, PAC-Bayes,
    sample complexity, optimization and training dynamics of neural networks,
    mean-field limits and Wasserstein gradient flows, neural tangent kernel,
    implicit bias, benign overfitting and double descent, random matrix theory
    for high-dimensional learning, theory of diffusion models, conformal prediction,
    singular learning theory, information geometry.

ai-news:
