# research-radar configuration
#
# Pick your topics below. Run `python -m radar presets` to see every built-in preset.
# Each entry can be:
#   - a preset key:                - probability
#   - a preset with overrides:     - preset: probability
#                                    top_k: 5
#                                    seed_ids: [2401.01234]
#   - a fully custom topic:        - name: My topic
#                                    slug: my-topic
#                                    source: arxiv          # or biorxiv / medrxiv
#                                    categories: [math.NT]
#                                    keywords: [modular forms]   # optional
#                                    interest: >
#                                      What you care about, in plain English.
#
# Tips: write `interest` as a comma-separated list of specific things; add `keywords`
# for huge categories like cs.LG; add `seed_ids` (papers you liked) to sharpen ranking.

language: en            # en or zh (digest text and AI summaries)
days: 1                 # 1 for a daily digest, 7 for weekly (match the schedule in .github/workflows/digest.yml)
overlap_days: 3         # extra lookback for late announcements; nothing is recommended twice
max_per_topic: 600
min_score: 0.10         # raise if digests feel noisy, lower if too many topics are empty
top_k_per_topic: 3      # papers per topic per day; remove to use each topic's own top_k
must_read: 3            # number of highlights at the top
include_revisions: false  # bioRxiv/medRxiv: skip new versions of older preprints
summarize: true         # needs the ANTHROPIC_API_KEY secret; without it, the abstract's first sentence is shown
model: claude-haiku-5-5
output_dir: docs/digests        # daily Markdown digests (readable on GitHub)
site_dir: docs                  # the website (GitHub Pages, folder /docs)
state_path: state/seen.json
archive_path: state/archive.jsonl
archive_days: 90
feed_days: 30                   # how far back each topic's feed goes on the website
site_title: Research Radar

# Optional accounts (sign in by email, topic choices sync across devices).
# Leave empty and the site still works: choices are saved in the browser.
# See README "Accounts" for the 10-minute Supabase setup.
supabase_url: ""
supabase_anon_key: ""

topics:
  # Readers choose from all of these on the website. Remove any you do not want to fetch.
  # Mathematics
  - probability
  - statistics-theory
  - differential-geometry
  - pde
  - harmonic-analysis
  - complex-analysis
  - combinatorics
  - math-physics
  - optimization-control
  # Computer science and AI
  - ml-theory
  - interpretability
  - ai4math
  - embodied-ai
  # Physics
  - theoretical-physics
  - quantum
  # Chemistry
  - chemistry
  - ml-for-molecules
  # Biology
  - biology
  - neuroscience
  - quantitative-biology
  - epidemiology
  # Economics
  - economics
  - game-theory
  - quantitative-finance
